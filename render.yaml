# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, pick this repo, then fill in the
# secrets it asks for (GROQ_API_KEY, APP_PASSWORD, ALPACA_API_KEY/SECRET).
services:
  - type: web
    name: trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRADER_AGENT_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Secrets: entered in the dashboard, never committed
      - key: GROQ_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
